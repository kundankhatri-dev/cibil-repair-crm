; ============================================================
; CIBIL Repair - SECURED PHP Configuration
; Production-Ready Settings with Maximum Security
; Last Updated: 2026-06-16
; ============================================================

; ============================================================
; SECURITY FIRST - CRITICAL SETTINGS
; ============================================================

; Disable dangerous functions completely
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source,phpinfo,highlight_file,dl,pcntl_exec

; Disable dangerous PHP features
disable_classes =
enable_dl = Off

; ============================================================
; ERROR HANDLING (NEVER show errors to users)
; ============================================================
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /home/u929623538/logs/php-error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE & ~E_WARNING

; For development only - comment out in production
; error_reporting = E_ALL
; display_errors = On

; ============================================================
; SECURE SESSION CONFIGURATION
; ============================================================
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.use_only_cookies = 1
session.use_strict_mode = 1
session.cookie_lifetime = 3600
session.gc_maxlifetime = 3600
session.sid_length = 128
session.sid_bits_per_character = 6

; ============================================================
; SECURE FILE UPLOADS (For Document Analysis)
; ============================================================
file_uploads = On
upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 5
upload_tmp_dir = /home/u929623538/tmp/

; ============================================================
; SECURE INPUT HANDLING
; ============================================================
max_input_vars = 3000
max_input_nesting_level = 64
max_input_time = 120

; ============================================================
; PERFORMANCE WITH SECURITY (OPcache)
; ============================================================
opcache.enable = 1
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_path = 0
opcache.enable_file_override = 0

; ============================================================
; COMPRESSION
; ------------------------------------------------------------
; IMPORTANT: zlib.output_compression MUST be Off
; When On it wraps PHP output in gzip encoding BEFORE ob_start()
; can clean the buffer — this corrupts JSON API responses and
; causes "network error" / JSON parse failures in the browser.
; Apache handles gzip compression via mod_deflate instead (see .htaccess).
; ============================================================
zlib.output_compression = Off
zlib.output_compression_level = -1

; ============================================================
; PATH & REALPATH CACHE (Performance)
; ============================================================
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; ============================================================
; TIME & MEMORY LIMITS (Safe for AI Processing)
; ============================================================
max_execution_time = 300
max_input_time = 300
memory_limit = 512M

; ============================================================
; CHARACTER SET (UTF-8 for Security)
; ------------------------------------------------------------
; IMPORTANT: mbstring.encoding_translation must be Off.
; When On it intercepts and re-encodes output buffers which
; can corrupt JSON responses containing special characters.
; ============================================================
default_charset = UTF-8
mbstring.internal_encoding = UTF-8
mbstring.http_output = UTF-8
mbstring.encoding_translation = Off

; ============================================================
; DATE TIME (IST for India)
; ============================================================
date.timezone = Asia/Kolkata

; ============================================================
; SECURE MAIL CONFIGURATION
; ============================================================
; disable mail() function if not needed
; disable_functions = mail ; (uncomment if you use external email service)

; ============================================================
; SECURE OPEN_BASEDIR (Restrict file access)
; ============================================================
; open_basedir = /home/u929623538/public_html:/home/u929623538/tmp:/home/u929623538/logs

; ============================================================
; SECURE TEMP DIRECTORY
; ============================================================
sys_temp_dir = /home/u929623538/tmp