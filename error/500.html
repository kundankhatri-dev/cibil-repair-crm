<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | CIBIL Repair</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a2e28 0%, #1f8a72 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-code {
            font-size: 100px;
            font-weight: 800;
            color: #dc3545;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(220,53,69,0.2);
        }
        h1 {
            font-size: 28px;
            color: #1a2c2e;
            margin-bottom: 15px;
        }
        p {
            color: #6c757d;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #1f8a72, #0e5e4c);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
            margin: 5px;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(31,138,114,0.3);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #1f8a72;
            color: #1f8a72;
        }
        .btn-outline:hover {
            background: #1f8a72;
            color: white;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .auto-refresh {
            margin-top: 20px;
            font-size: 13px;
            color: #6c757d;
        }
        .support-link {
            margin-top: 20px;
            font-size: 12px;
        }
        .support-link a {
            color: #1f8a72;
            text-decoration: none;
        }
        .support-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">500</div>
        <div class="icon">⚠️</div>
        <h1>Internal Server Error</h1>
        <p>Something went wrong on our end. Our technical team has been notified and is working on a fix.</p>
        <div>
            <a href="javascript:location.reload()" class="btn">🔄 Try Again</a>
            <a href="javascript:history.back()" class="btn btn-outline">🔙 Go Back</a>
            <a href="/" class="btn btn-outline">🏠 Go Home</a>
        </div>
        <div class="auto-refresh">
            <span id="countdown">5</span> seconds - Auto redirecting to home...
        </div>
        <div class="support-link">
            If the problem persists, <a href="/contact.html">contact our support team</a>
        </div>
    </div>
    <script>
        // Auto redirect countdown
        let countdown = 5;
        const countdownElement = document.getElementById('countdown');
        if (countdownElement) {
            const interval = setInterval(function() {
                countdown--;
                countdownElement.textContent = countdown;
                if (countdown <= 0) {
                    clearInterval(interval);
                    window.location.href = '/';
                }
            }, 1000);
        }
    </script>
</body>
</html>
