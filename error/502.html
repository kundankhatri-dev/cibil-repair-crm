<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>502 - Bad Gateway | CIBIL Repair</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a2e28 0%, #1f8a72 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-code {
            font-size: 100px;
            font-weight: 800;
            color: #f97316;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(249,115,22,0.2);
        }
        h1 {
            font-size: 28px;
            color: #1a2c2e;
            margin-bottom: 15px;
        }
        p {
            color: #6c757d;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .small-text {
            font-size: 13px;
            color: #95a5a6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #1f8a72, #0e5e4c);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
            margin: 5px;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(31,138,114,0.3);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #1f8a72;
            color: #1f8a72;
        }
        .btn-outline:hover {
            background: #1f8a72;
            color: white;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .retry-btn {
            background: linear-gradient(135deg, #f97316, #ea580c);
        }
        .retry-btn:hover {
            box-shadow: 0 5px 15px rgba(249,115,22,0.3);
        }
        .countdown {
            font-size: 13px;
            color: #6c757d;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">502</div>
        <div class="icon">⚠️</div>
        <h1>Bad Gateway</h1>
        <p>The server received an invalid response from the upstream server. This is usually a temporary issue.</p>
        <p class="small-text">Our technical team has been notified and is working to resolve the issue.</p>
        <a href="/" class="btn">🏠 Go Home</a>
        <a href="javascript:location.reload()" class="btn retry-btn">🔄 Try Again</a>
        <a href="javascript:history.back()" class="btn btn-outline">🔙 Go Back</a>
        <div class="countdown" id="countdown">
            Retrying in <span id="timer">5</span> seconds...
        </div>
        <p style="margin-top: 20px; font-size: 12px;">
            <a href="/contact.html" style="color: #1f8a72;">Need help? Contact Support</a>
        </p>
    </div>
    <script>
        // Auto retry countdown (silent, no confirm popup)
        let seconds = 5;
        const timerElement = document.getElementById('timer');
        if (timerElement) {
            const countdown = setInterval(function() {
                seconds--;
                if (timerElement) timerElement.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(countdown);
                    location.reload();
                }
            }, 1000);
        }
    </script>
</body>
</html>
