<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Report Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #1a237e, #0d47a1); color: white; padding: 20px 30px; border-radius: 15px; margin-bottom: 25px; }
        .header h1 { font-size: 28px; }
        .header p { opacity: 0.8; margin-top: 5px; }
        .grid { display: grid; grid-template-columns: 350px 1fr; gap: 25px; }
        .sidebar { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .sidebar h3 { margin-bottom: 15px; color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; color: #555; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-group input:focus, .form-group select:focus { border-color: #0d9e78; outline: none; }
        .btn { padding: 12px 24px; background: #0d9e78; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; width: 100%; }
        .btn:hover { background: #0a7d60; }
        .btn-secondary { background: #666; }
        .btn-secondary:hover { background: #555; }
        .content { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); min-height: 400px; }
        .report-list { margin-top: 20px; }
        .report-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; align-items: center; }
        .report-item:hover { background: #f5f5f5; }
        .report-name { font-weight: 600; }
        .report-date { color: #666; font-size: 13px; }
        .btn-sm { padding: 6px 12px; font-size: 12px; width: auto; }
        .table-wrap { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f5f5f5; padding: 10px; text-align: left; font-weight: 600; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .status { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .status-completed { background: #4caf50; color: white; }
        .status-pending { background: #ff9800; color: white; }
        .status-draft { background: #9e9e9e; color: white; }
        .filters-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } .filters-row { grid-template-columns: 1fr; } }
        .preview-data { background: #f8f9fa; padding: 15px; border-radius: 8px; overflow: auto; max-height: 400px; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Advanced Report Generator</h1>
            <p>Create custom reports with filters and export to multiple formats</p>
        </div>
        
        <div class="grid">
            <div class="sidebar">
                <h3>📋 Report Configuration</h3>
                <form id="reportForm">
                    <div class="form-group">
                        <label>Report Type</label>
                        <select name="type" id="reportType">
                            <option value="sales">Sales Report</option>
                            <option value="leads">Leads Report</option>
                            <option value="customers">Customers Report</option>
                            <option value="partners">Partners Report</option>
                            <option value="credit_analysis">Credit Analysis Report</option>
                            <option value="disputes">Disputes Report</option>
                        </select>
                    </div>
                    
                    <div id="dateFilters">
                        <div class="filters-row">
                            <div class="form-group">
                                <label>Date From</label>
                                <input type="date" name="date_from" id="dateFrom">
                            </div>
                            <div class="form-group">
                                <label>Date To</label>
                                <input type="date" name="date_to" id="dateTo">
                            </div>
                        </div>
                    </div>
                    
                    <div id="statusFilter">
                        <div class="form-group">
                            <label>Status</label>
                            <select name="status" id="statusFilterSelect">
                                <option value="">All Status</option>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                                <option value="pending">Pending</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn">🔄 Generate Report</button>
                </form>
                
                <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">
                
                <h3>📁 Saved Reports</h3>
                <div id="reportList">
                    <p style="color: #999; text-align: center; padding: 20px;">Loading reports...</p>
                </div>
            </div>
            
            <div class="content">
                <div id="reportContent">
                    <div style="text-align: center; padding: 60px 20px; color: #999;">
                        <div style="font-size: 48px; margin-bottom: 15px;">📊</div>
                        <h2>No Report Generated</h2>
                        <p>Configure your report settings and click "Generate Report"</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'report-generator.php';
        
        // Load saved reports
        function loadReports() {
            fetch(API_URL + '?action=list&limit=10')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('reportList');
                    if (data.length === 0) {
                        container.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">No reports saved yet</p>';
                        return;
                    }
                    container.innerHTML = data.map(r => `
                        <div class="report-item">
                            <div>
                                <div class="report-name">${r.report_name}</div>
                                <div class="report-date">${r.generated_at}</div>
                            </div>
                            <div>
                                <button class="btn btn-sm" onclick="viewReport(${r.id})">View</button>
                                <button class="btn btn-sm btn-secondary" onclick="downloadReport(${r.id})">⬇</button>
                            </div>
                        </div>
                    `).join('');
                })
                .catch(err => {
                    document.getElementById('reportList').innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">Error loading reports</p>';
                });
        }
        
        // Generate report
        document.getElementById('reportForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => { data[key] = value; });
            
            const content = document.getElementById('reportContent');
            content.innerHTML = '<div style="text-align: center; padding: 40px;">⏳ Generating report...</div>';
            
            fetch(API_URL + '?action=generate&type=' + data.type, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                if (result.error) {
                    content.innerHTML = `<div style="color: red; text-align: center; padding: 40px;">❌ ${result.error}</div>`;
                    return;
                }
                
                displayReport(result);
                loadReports();
            })
            .catch(err => {
                content.innerHTML = '<div style="color: red; text-align: center; padding: 40px;">❌ Error generating report</div>';
            });
        });
        
        // Display report
        function displayReport(result) {
            const content = document.getElementById('reportContent');
            const data = result.data;
            
            if (!data || !data.data) {
                content.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">No data found</div>';
                return;
            }
            
            const records = data.data;
            const columns = records.length > 0 ? Object.keys(records[0]) : [];
            
            let html = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <div>
                        <h2>${data.title || 'Report'}</h2>
                        <p style="color: #666; font-size: 13px;">${records.length} records | Generated: ${result.generated_at}</p>
                    </div>
                    <div>
                        <button class="btn btn-sm" onclick="downloadReport(${result.report_id})">📥 Download JSON</button>
                    </div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>${columns.map(col => `<th>${col}</th>`).join('')}</tr>
                        </thead>
                        <tbody>
                            ${records.slice(0, 50).map(row => `
                                <tr>${columns.map(col => `<td>${row[col] || '-'}</td>`).join('')}</tr>
                            `).join('')}
                        </tbody>
                    </table>
                    ${records.length > 50 ? `<p style="color: #999; font-size: 12px; margin-top: 10px;">Showing first 50 of ${records.length} records</p>` : ''}
                </div>
                <div class="preview-data">
                    <strong>Raw Data (${records.length} records):</strong>
                    <pre>${JSON.stringify(records.slice(0, 5), null, 2)}${records.length > 5 ? '\n... and ' + (records.length - 5) + ' more' : ''}</pre>
                </div>
            `;
            
            content.innerHTML = html;
        }
        
        // View saved report
        function viewReport(id) {
            const content = document.getElementById('reportContent');
            content.innerHTML = '<div style="text-align: center; padding: 40px;">⏳ Loading report...</div>';
            
            fetch(API_URL + '?action=get&id=' + id)
                .then(res => res.json())
                .then(data => {
                    if (!data || !data.report_data) {
                        content.innerHTML = '<div style="color: red; text-align: center; padding: 40px;">❌ Report not found</div>';
                        return;
                    }
                    const reportData = JSON.parse(data.report_data);
                    displayReport({ data: reportData, report_id: id, generated_at: data.generated_at });
                })
                .catch(err => {
                    content.innerHTML = '<div style="color: red; text-align: center; padding: 40px;">❌ Error loading report</div>';
                });
        }
        
        // Download report
        function downloadReport(id) {
            window.open(API_URL + '?action=download&id=' + id, '_blank');
        }
        
        // Toggle filters based on report type
        document.getElementById('reportType').addEventListener('change', function() {
            const type = this.value;
            const statusFilter = document.getElementById('statusFilter');
            const dateFilters = document.getElementById('dateFilters');
            
            if (['sales', 'leads', 'customers', 'credit_analysis', 'disputes'].includes(type)) {
                dateFilters.style.display = 'block';
            } else {
                dateFilters.style.display = 'none';
            }
            
            if (['sales', 'leads', 'customers', 'partners', 'credit_analysis'].includes(type)) {
                statusFilter.style.display = 'block';
            } else {
                statusFilter.style.display = 'none';
            }
        });
        
        // Initialize
        loadReports();
        
        // Refresh reports every 30 seconds
        setInterval(loadReports, 30000);
    </script>
</body>
</html>
